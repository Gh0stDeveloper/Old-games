name: Diamond Rush - Fan Engine DEX Research

on:
  push:
    branches:
      - feat/diamond-rush-fan-levels-engine
    paths:
      - ".github/workflows/diamond-rush-fan-engine.yml"
      - "games/Diamond-Rush/fan-levels/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diamond-rush-fan-engine
  cancel-in-progress: true

jobs:
  dex-roundtrip:
    name: Inspect and reconstruct DEX (NO APK build)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install open-source Android reverse-engineering tools
        run: |
          sudo timeout 180s apt-get update -qq
          sudo timeout 180s env DEBIAN_FRONTEND=noninteractive apt-get install -y apktool smali
          apktool --version
          smali --version

      - name: Compile and test fan navigation/persistence modules (JVM only)
        run: |
          mkdir -p build/fan-java
          javac --release 8 -d build/fan-java \
            games/Diamond-Rush/fan-levels/src/ghost/diamondrush/fan/*.java \
            games/Diamond-Rush/fan-levels/tests/FanBridgeSmokeTest.java
          java -cp build/fan-java FanBridgeSmokeTest
          jar cf build/fan-bridge.jar -C build/fan-java ghost

      - name: Verify the existing repository APK and original level counts
        run: |
          python3 games/Diamond-Rush/fan-levels/tools/ci_guard.py inspect \
            --apk games/Diamond-Rush/Diamond_Rush_1.1_Android7-16_compat_v8.apk \
            --out build/inspection.json

      - name: Disassemble DEX to smali (research only)
        run: |
          apktool d --force --no-res \
            games/Diamond-Rush/Diamond_Rush_1.1_Android7-16_compat_v8.apk \
            --output build/decoded

      - name: Trace actual menu and world-loader smali methods
        run: |
          python3 games/Diamond-Rush/fan-levels/tools/trace_engine_smali.py \
            --smali build/decoded --out build/engine-methods.json

      - name: Reassemble each smali tree to DEX, without packaging an APK
        run: |
          set -euo pipefail
          test -d build/decoded/smali
          smali assemble build/decoded/smali -o build/classes.dex
          if test -d build/decoded/smali_classes2; then
            smali assemble build/decoded/smali_classes2 -o build/classes2.dex
          fi

      - name: Insert fan Java bridge classes into a TEMPORARY DEX (no APK)
        run: |
          set -euo pipefail
          D8="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name d8 | sort -V | tail -1)"
          test -n "$D8" || { echo "GitHub runner Android SDK d8 missing"; exit 1; }
          mkdir -p build/fan-dex build/fan-smali build/merged-smali
          "$D8" --min-api 26 --output build/fan-dex build/fan-bridge.jar
          baksmali disassemble build/fan-dex/classes.dex -o build/fan-smali
          test -f build/fan-smali/ghost/diamondrush/fan/FanRuntimeAdapter.smali
          cp -R build/decoded/smali/. build/merged-smali/
          cp -R build/fan-smali/ghost build/merged-smali/
          python3 games/Diamond-Rush/fan-levels/tools/patch_world_routes.py \
            --smali build/merged-smali/com/gdxgame/c/a/b.smali \
            --out build/world-route-patch.json
          smali assemble build/merged-smali -o build/merged-classes.dex
          python3 games/Diamond-Rush/fan-levels/tools/ci_guard.py injection \
            --apk games/Diamond-Rush/Diamond_Rush_1.1_Android7-16_compat_v8.apk \
            --merged build/merged-classes.dex --out build/bridge-injection.json

      - name: Patch REAL menu action and label in temporary smali (no APK)
        run: |
          python3 games/Diamond-Rush/fan-levels/tools/patch_menu_smali.py \
            --smali build/merged-smali/com/gdxgame/c/a/b.smali \
            --out build/menu-patch.json
          smali assemble build/merged-smali -o build/merged-classes.dex
          python3 games/Diamond-Rush/fan-levels/tools/ci_guard.py injection \
            --apk games/Diamond-Rush/Diamond_Rush_1.1_Android7-16_compat_v8.apk \
            --merged build/merged-classes.dex --out build/bridge-injection.json

      - name: Decode original DEX with identical baksmali version for semantic comparison
        run: |
          mkdir -p build/baseline-smali
          unzip -p games/Diamond-Rush/Diamond_Rush_1.1_Android7-16_compat_v8.apk classes.dex > build/baseline-classes.dex
          baksmali disassemble build/baseline-classes.dex -o build/baseline-smali/smali
          unzip -p games/Diamond-Rush/Diamond_Rush_1.1_Android7-16_compat_v8.apk classes2.dex > build/baseline-classes2.dex
          baksmali disassemble build/baseline-classes2.dex -o build/baseline-smali/smali_classes2

      - name: Disassemble rebuilt DEX again to verify actual smali instructions
        run: |
          mkdir -p build/redecoded
          baksmali disassemble build/classes.dex -o build/redecoded/smali
          if test -f build/classes2.dex; then
            baksmali disassemble build/classes2.dex -o build/redecoded/smali_classes2
          fi

      - name: Compare DEX symbol tables and generate navigation report
        run: |
          python3 games/Diamond-Rush/fan-levels/tools/ci_guard.py roundtrip \
            --apk games/Diamond-Rush/Diamond_Rush_1.1_Android7-16_compat_v8.apk \
            --rebuilt build/classes.dex --rebuilt-second build/classes2.dex --out build/roundtrip.json
          python3 games/Diamond-Rush/fan-levels/tools/ci_guard.py compare-smali \
            --original build/baseline-smali --rebuilt build/redecoded --out build/smali-comparison.json
          python3 games/Diamond-Rush/fan-levels/tools/ci_guard.py report \
            --smali build/decoded --out build/navigation.md
          cat build/navigation.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No installable APK or keystore produced." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports only (no APK, DEX, game assets or keys)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diamond-rush-dex-research
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/inspection.json
            build/engine-methods.json
            build/roundtrip.json
            build/bridge-injection.json
            build/menu-patch.json
            build/world-route-patch.json
            build/smali-comparison.json
            build/navigation.md
